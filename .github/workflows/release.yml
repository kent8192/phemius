name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          targets: aarch64-apple-darwin
      - name: Build
        run: cargo build --release --target aarch64-apple-darwin
      - name: Package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          stage="phemius-${TAG}-aarch64-apple-darwin"
          mkdir -p "$stage"
          cp "target/aarch64-apple-darwin/release/phemius" "$stage/"
          cp README.md LICENSE "$stage/"
          tar -czf "$stage.tar.gz" "$stage"
          shasum -a 256 "$stage.tar.gz" > "$stage.tar.gz.sha256"
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            phemius-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
            phemius-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz.sha256
